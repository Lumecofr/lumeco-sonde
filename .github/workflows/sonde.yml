# Sonde externe LUMECO — dépôt PUBLIC dédié (03/10/2026, audit T4).
# Pourquoi un dépôt à part : dans le dépôt privé lumeco-crm, le cron « */15 » ne tournait que ≈ 5 fois par jour
# (9 passages en 41 h mesurés le 03/10 : GitHub met en file les crons des dépôts privés peu actifs). Un dépôt public
# n'a ni quota de minutes ni cette file. Il ne contient que ce fichier : aucun code, aucun secret (TG_TOKEN / TG_CHAT
# sont des secrets du dépôt, mêmes valeurs que ~/.yankinvest/fleet/.telegram.env).
# Ce qu'elle fait, toutes les 15 min, depuis l'extérieur du Mac :
#   • /, /crm, /bar-th-168/ : HTTP 200 + un mot attendu dans la page ; /destratificateur/ : page attendue (404 = pas
#     encore publiée, signalé dans le battement du matin ; 5xx = panne) ; Firestore joignable ; certificat TLS > 14 j.
#   • Alerte Telegram au CHANGEMENT d'état (panne / rétablissement) puis rappel horaire tant que la panne dure.
#   • Battement quotidien « 🟢 tout va bien » à 7 h (heure de Paris) : silence = la sonde est morte, pas le site.
#     Le battement écrit DERNIER_PASSAGE.md (commit) : un dépôt public sans activité 60 j verrait ses crons désactivés.
#   • Test de la chaîne : Actions → « Sonde lum-eco.fr » → Run workflow → test_panne = true (alerte 🧪 explicite).
# Promotion de /destratificateur/ en page stricte après publication : passer son 3e champ à « strict ».
name: Sonde lum-eco.fr

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 5 * * *"    # 07:00 Paris en heure d'été
    - cron: "0 6 * * *"    # 07:00 Paris en heure d'hiver (l'autre passage est ignoré : on ne garde que 07 h Paris)
  workflow_dispatch:
    inputs:
      test_panne:
        description: "Provoquer une panne contrôlée (URL inexistante) pour tester l'alerte Telegram"
        type: boolean
        default: false
      battement:
        description: "Envoyer le battement « tout va bien » maintenant"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: sonde
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Vérifier le site
        id: verif
        shell: bash
        env:
          TEST_PANNE: ${{ inputs.test_panne }}
        run: |
          set -u
          BASE="https://lum-eco.fr"
          # url | mot attendu dans la page | strict / attendue
          CIBLES=(
            "$BASE/|LUMECO|strict"
            "$BASE/crm|firebase|strict"
            "$BASE/bar-th-168/|generate_lead|strict"
            "$BASE/destratificateur/|destratificateur|attendue"
          )
          [ "${TEST_PANNE:-false}" = "true" ] && CIBLES+=("$BASE/sonde-test-panne-controlee-$(date +%s)/|LUMECO|strict")
          sonder() { # $1 = "url|motif|mode" → écrit CODE ; 0 OK, 1 panne, 2 attendue non publiée
            local url motif mode corps; IFS='|' read -r url motif mode <<<"$1"
            corps=$(curl -sL --max-time 25 -w '\n%{http_code}' "$url") || true
            CODE="${corps##*$'\n'}"; [ -z "$CODE" ] && CODE=000
            if [ "$CODE" != "200" ]; then
              [ "$mode" = attendue ] && [ "$CODE" = 404 ] && return 2
              DETAIL="$url → HTTP $CODE"; return 1
            fi
            grep -qi -- "$motif" <<<"$corps" || { DETAIL="$url → 200 mais « $motif » absent"; return 1; }
            return 0
          }
          PANNES=""; ATTENTES=""; OK=0
          for c in "${CIBLES[@]}"; do
            sonder "$c"; rc=$?
            if [ $rc = 1 ]; then
              sleep 45   # seconde chance : un incident de 45 s ne réveille personne
              sonder "$c"; rc=$?
            fi
            case $rc in 0) OK=$((OK+1));; 1) PANNES+="• $DETAIL"$'\n';; 2) ATTENTES+="• ${c%%|*} pas encore publiée (404)"$'\n';; esac
          done
          # Firestore joignable (403 sans clé = le service répond)
          FS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://firestore.googleapis.com/v1/projects/crm-lumeco/databases/(default)/documents/reglages?pageSize=1" || echo 000)
          case "$FS" in 200|401|403) ;; *) PANNES+="• Firestore injoignable (HTTP $FS)"$'\n';; esac
          # Certificat TLS > 14 jours
          FIN=$(echo | openssl s_client -servername lum-eco.fr -connect lum-eco.fr:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          JOURS=""
          if [ -n "$FIN" ]; then
            JOURS=$(( ( $(date -d "$FIN" +%s) - $(date +%s) ) / 86400 ))
            [ "$JOURS" -lt 14 ] && PANNES+="• certificat TLS expire dans $JOURS jour(s) ($FIN)"$'\n'
          else PANNES+="• certificat TLS illisible"$'\n'; fi
          RESUME="$OK page(s) OK · Firestore HTTP $FS · TLS ${JOURS:-?} j"
          echo "resume=$RESUME" >> "$GITHUB_OUTPUT"
          { echo 'attentes<<FIN'; printf '%s' "$ATTENTES"; echo 'FIN'; } >> "$GITHUB_OUTPUT"
          if [ -n "$PANNES" ]; then
            echo "etat=ko" >> "$GITHUB_OUTPUT"
            { echo 'pannes<<FIN'; printf '%s' "$PANNES"; echo 'FIN'; } >> "$GITHUB_OUTPUT"
            printf '%s\n%s' "$PANNES" "$RESUME"
          else
            echo "etat=ok" >> "$GITHUB_OUTPUT"; echo "✅ $RESUME"; printf '%s' "$ATTENTES"
          fi

      - name: État du passage précédent
        id: avant
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prec=$(gh run list -R "$GITHUB_REPOSITORY" --workflow sonde.yml --status completed --limit 1 \
                   --json conclusion -q '.[0].conclusion' 2>/dev/null || echo "")
          echo "conclusion=${prec:-inconnue}" >> "$GITHUB_OUTPUT"

      - name: Battement quotidien ?
        id: battement
        shell: bash
        env:
          CRON: ${{ github.event.schedule }}
          FORCE: ${{ inputs.battement }}
        run: |
          H=$(TZ=Europe/Paris date '+%H')
          if [ "${FORCE:-false}" = "true" ] || { [ "$CRON" = "0 5 * * *" ] || [ "$CRON" = "0 6 * * *" ]; } && [ "$H" = "07" ]; then
            echo "oui=1" >> "$GITHUB_OUTPUT"
          else echo "oui=0" >> "$GITHUB_OUTPUT"; fi

      - name: Alerte / battement Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ETAT: ${{ steps.verif.outputs.etat }}
          PANNES: ${{ steps.verif.outputs.pannes }}
          ATTENTES: ${{ steps.verif.outputs.attentes }}
          RESUME: ${{ steps.verif.outputs.resume }}
          AVANT: ${{ steps.avant.outputs.conclusion }}
          BATTEMENT: ${{ steps.battement.outputs.oui }}
          TEST_PANNE: ${{ inputs.test_panne }}
        shell: bash
        run: |
          [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ] || { echo "secrets TG_TOKEN/TG_CHAT absents → pas d'alerte"; exit 0; }
          MIN=$(date -u +%M); HEURE=$(TZ=Europe/Paris date '+%d/%m %H:%M')
          PFX=""; [ "${TEST_PANNE:-false}" = "true" ] && PFX="🧪 TEST · "
          MSG=""
          if [ "$ETAT" = "ko" ]; then
            if [ "$AVANT" != "failure" ] || [ "$((10#$MIN))" -lt 15 ] || [ -n "$PFX" ]; then
              MSG="${PFX}🔴 [LUMECO] Sonde externe — $HEURE"$'\n'"$PANNES"$'\n'"Retour arrière : ./scripts/revenir-en-arriere.sh"
            fi
          elif [ "$AVANT" = "failure" ]; then
            MSG="🟢 [LUMECO] Sonde externe — $HEURE : site, CRM et /bar-th-168/ rétablis."
          elif [ "$BATTEMENT" = "1" ]; then
            MSG="🟢 [LUMECO] Sonde externe — $HEURE : tout va bien ($RESUME). Battement quotidien : son absence = sonde GitHub morte."
            [ -n "$ATTENTES" ] && MSG+=$'\n'"$ATTENTES"
          fi
          [ -z "$MSG" ] && { echo "pas de changement d'état → pas de message"; exit 0; }
          curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" -d "disable_web_page_preview=true" --data-urlencode "text=${MSG}" \
            | grep -q '"ok":true' && echo "message envoyé" || { echo "envoi Telegram en échec"; exit 1; }

      - name: Trace du battement (garde le dépôt actif)
        if: steps.battement.outputs.oui == '1'
        shell: bash
        env:
          RESUME: ${{ steps.verif.outputs.resume }}
          ETAT: ${{ steps.verif.outputs.etat }}
        run: |
          git config user.name "sonde-lumeco"; git config user.email "sonde@users.noreply.github.com"
          git fetch --depth=1 origin "$GITHUB_REF_NAME" && git checkout -q "$GITHUB_REF_NAME"
          printf '# Dernier battement\n\n%s (Paris) — état %s — %s\n' "$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')" "$ETAT" "$RESUME" > DERNIER_PASSAGE.md
          git add DERNIER_PASSAGE.md
          git commit -q -m "battement $(TZ=Europe/Paris date '+%Y-%m-%d')" && git push -q || echo "rien à committer"

      - name: Échouer si panne (rend la panne visible dans l'historique)
        if: steps.verif.outputs.etat == 'ko'
        run: exit 1
